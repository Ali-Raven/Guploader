<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>DropFile</title>

</head>

<body>

    <div class="container">

        <div class="header">

            <div class="logo">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">

                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4" />

                </svg>
            </div>

            <h1>DropFile</h1>

            <p>
                Upload a file and share it anywhere.
            </p>

        </div>


        <div class="card">

            <div class="drop-zone" id="dropZone">

                <div class="upload-icon">

                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0L7 9m5-5 5 5M5 20h14" />

                    </svg>

                </div>

                <h3>Drop your file here</h3>

                <p>
                    or <span class="browse">browse files</span>
                </p>

                <input type="file" id="fileInput" />

            </div>


            <div class="file-info" id="fileInfo">

                <div class="file-icon">
                    📄
                </div>

                <div class="file-details">

                    <div class="file-name" id="fileName">
                    </div>

                    <div class="file-size" id="fileSize">
                    </div>

                </div>

                <button class="remove" id="removeFile">
                    ×
                </button>

            </div>


            <button class="upload-btn" id="uploadButton">

                Upload File

            </button>


            <div class="progress-container" id="progressContainer">

                <div class="progress-info">

                    <span>Uploading...</span>

                    <span id="progressText">
                        0%
                    </span>

                </div>

                <div class="progress-bg">

                    <div class="progress" id="progress">
                    </div>

                </div>

            </div>


            <div class="result" id="result">

                <div class="success-title">
                    ✓ File uploaded successfully
                </div>

                <div class="link-box">

                    <!-- <input id="downloadLink" readonly /> -->
                     <a id="downloadLink" href="#" target="_blank"></a>

                    <button class="copy-btn" id="copyButton">
                        Copy
                    </button>

                </div>

            </div>

        </div>


        <div class="footer">
            Simple. Fast. Private.
        </div>

    </div>


    <script>

        const dropZone = document.getElementById("dropZone");
        const fileInput = document.getElementById("fileInput");

        const fileInfo = document.getElementById("fileInfo");
        const fileName = document.getElementById("fileName");
        const fileSize = document.getElementById("fileSize");

        const uploadButton = document.getElementById("uploadButton");

        const removeFile = document.getElementById("removeFile");

        const progressContainer =
            document.getElementById("progressContainer");

        const progress =
            document.getElementById("progress");

        const progressText =
            document.getElementById("progressText");

        const result =
            document.getElementById("result");

        const downloadLink =
            document.getElementById("downloadLink");

        const copyButton =
            document.getElementById("copyButton");


        let selectedFile = null;


        // Open file picker
        dropZone.addEventListener("click", () => {
            fileInput.click();
        });


        // File selected
        fileInput.addEventListener("change", () => {

            if (fileInput.files.length > 0) {

                selectFile(fileInput.files[0]);

            }

        });


        // Drag events
        dropZone.addEventListener("dragover", (event) => {

            event.preventDefault();

            dropZone.classList.add("dragging");

        });


        dropZone.addEventListener("dragleave", () => {

            dropZone.classList.remove("dragging");

        });


        dropZone.addEventListener("drop", (event) => {

            event.preventDefault();

            dropZone.classList.remove("dragging");

            if (event.dataTransfer.files.length > 0) {

                selectFile(event.dataTransfer.files[0]);

            }

        });


        function selectFile(file) {

            selectedFile = file;

            fileName.textContent = file.name;

            fileSize.textContent =
                formatFileSize(file.size);

            fileInfo.style.display = "flex";

            uploadButton.style.display = "block";

            result.style.display = "none";

        }


        function formatFileSize(bytes) {

            if (bytes === 0)
                return "0 Bytes";

            const units = [
                "Bytes",
                "KB",
                "MB",
                "GB"
            ];

            const index =
                Math.floor(
                    Math.log(bytes) /
                    Math.log(1024)
                );

            return (
                (bytes / Math.pow(1024, index))
                    .toFixed(2)
                +
                " "
                +
                units[index]
            );

        }


        removeFile.addEventListener("click", (event) => {

            event.stopPropagation();

            selectedFile = null;

            fileInput.value = "";

            fileInfo.style.display = "none";

            uploadButton.style.display = "none";

            progressContainer.style.display = "none";

            result.style.display = "none";

        });


        // Upload
        uploadButton.addEventListener("click", () => {

            if (!selectedFile)
                return;


            const formData = new FormData();

            formData.append(
                "file",
                selectedFile
            );


            const xhr = new XMLHttpRequest();


            xhr.open(
                "POST",
                "/upload",
                true
            );


            progressContainer.style.display = "block";

            uploadButton.disabled = true;


            xhr.upload.onprogress = function (event) {

                if (!event.lengthComputable)
                    return;


                const percent =
                    Math.round(
                        event.loaded /
                        event.total *
                        100
                    );


                progress.style.width =
                    percent + "%";


                progressText.textContent =
                    percent + "%";

            };


            xhr.onload = function () {

                uploadButton.disabled = false;


                if (
                    xhr.status >= 200 &&
                    xhr.status < 300
                ) {

                    try {

                        const response =
                            JSON.parse(
                                xhr.responseText
                            );


                        downloadLink.value =
                            response.url;
                        downloadLink.href = response.url
                        downloadLink.textContent = response.url

                        result.style.display =
                            "block";


                    } catch (error) {

                        alert(
                            "Invalid response from server."
                        );

                    }

                } else {

                    alert(
                        "Upload failed."
                    );

                }

            };


            xhr.onerror = function () {

                uploadButton.disabled = false;

                alert(
                    "Could not connect to server."
                );

            };


            xhr.send(formData);

        });


        // Copy download link
        copyButton.addEventListener("click", async () => {

            await navigator.clipboard.writeText(
                downloadLink.value
            );


            copyButton.textContent = "Copied!";


            setTimeout(() => {

                copyButton.textContent = "Copy";

            }, 1500);

        });

    </script>

</body>

</html>
